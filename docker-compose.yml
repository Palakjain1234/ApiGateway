version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# GateKeeper — Full Stack (Infrastructure + Application Services)
#
# Infrastructure:
#   mysql               → API Management data         (port 3306)
#   mongodb             → Analytics data              (port 27017)
#   redis               → Rate limit / idempotency    (port 6379)
#   zookeeper           → Required by Kafka           (port 2181)
#   kafka               → Event streaming             (port 9092)
#
# Application Services:
#   api-management      → Control plane               (port 8080)
#   smart-gateway       → Data plane / proxy          (port 8081)
#   analytics           → Stats + event storage       (port 8082)
#   catalog-service     → Demo tenant backend         (port 8091)
#   order-service       → Demo tenant backend         (port 8092)
#
# Usage:
#   # Build all JARs first:
#   mvn clean package -DskipTests
#
#   # Start everything:
#   docker-compose up -d
#
#   # Stop everything:
#   docker-compose down
#   docker-compose down -v   (also removes volumes — wipes data)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MySQL ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: gatekeeper-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gatekeeper_db
      MYSQL_USER: gatekeeper
      MYSQL_PASSWORD: gatekeeper123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gatekeeper-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: gatekeeper-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: gatekeeper
      MONGO_INITDB_ROOT_PASSWORD: gatekeeper123
      MONGO_INITDB_DATABASE: gatekeeper_analytics
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - gatekeeper-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: gatekeeper-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gatekeeper-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Zookeeper (required by Kafka) ──────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: gatekeeper-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - gatekeeper-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka ──────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: gatekeeper-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Listeners: internal (container-to-container) + external (host machine)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - gatekeeper-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes (data persists across container restarts)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
  mongodb_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:

# ─────────────────────────────────────────────────────────────────────────────
# Network (all services talk to each other on this bridge network)
# ─────────────────────────────────────────────────────────────────────────────
networks:
  gatekeeper-network:
    driver: bridge

  # ── Application Services ───────────────────────────────────────────────────

  api-management:
    build: ./api-management-service
    container_name: gatekeeper-api-management
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gatekeeper_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: gatekeeper
      SPRING_DATASOURCE_PASSWORD: gatekeeper123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - gatekeeper-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  smart-gateway:
    build: ./smart-gateway-service
    container_name: gatekeeper-smart-gateway
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GATEKEEPER_MANAGEMENT_BASE_URL: http://api-management:8080
    depends_on:
      api-management:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - gatekeeper-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  analytics:
    build: ./analytics-service
    container_name: gatekeeper-analytics
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://gatekeeper:gatekeeper123@mongodb:27017/gatekeeper_analytics?authSource=admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - gatekeeper-network

  catalog-service:
    build: ./catalog-service
    container_name: gatekeeper-catalog
    restart: unless-stopped
    ports:
      - "8091:8091"
    networks:
      - gatekeeper-network

  order-service:
    build: ./order-service
    container_name: gatekeeper-order
    restart: unless-stopped
    ports:
      - "8092:8092"
    networks:
      - gatekeeper-network
