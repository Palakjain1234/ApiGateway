server:
  port: 8080

spring:
  application:
    name: api-management-service

  # ── MySQL ────────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3307/gatekeeper_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: gatekeeper
    password: gatekeeper123
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ── JPA ─────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  # ── Flyway ───────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Kafka ────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

# ── JWT ───────────────────────────────────────────────────────────────────
gatekeeper:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970   # 256-bit hex key
    expiration-ms: 86400000   # 24 hours

# ── Kafka topic names ──────────────────────────────────────────────────────
  kafka:
    topics:
      route-changes: gatekeeper.route.changes

# ── Actuator ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gatekeeper: DEBUG
    org.springframework.security: INFO
